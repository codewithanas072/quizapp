<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App with Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        #container {
            width: 600px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        #qno {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 12px;
            font-weight: bold;
        }

        #question {
            font-size: 28px;
            color: #222;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .op1 {
            width: 100%;
            min-height: 60px;
            display: flex;
            align-items: center;
            padding: 15px 18px;
            margin: 12px 0;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .op1:hover {
            border-color: #667eea;
            background: #f1f3ff;
            transform: translateY(-2px);
        }

        .op1 input {
            width: 18px;
            height: 18px;
            margin-right: 14px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .op1 label {
            font-size: 17px;
            color: #333;
            cursor: pointer;
            flex: 1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 650px) {
            #container {
                width: 90%;
                padding: 25px;
            }

            #question {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <!-- Signup Form (Default View) -->
        <div id="signup-screen">
            <h2>Student Registration</h2>
            <br>
            <div class="input-group">
                <label for="rollno">Roll Number</label>
                <input type="text" id="rollno" placeholder="Enter your roll number">
            </div>
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen (Hidden Initially) -->
        <div id="quiz-screen" style="display: none;">
            <h1 id="qno"></h1>
            <h1 id="question"></h1>
            <div class="op1">
                <input type="radio" name="quiz" id="option1" />
                <label for="option1" id="label1"></label>
            </div>
            <div class="op1">
                <input type="radio" name="quiz" id="option2" />
                <label for="option2" id="label2"></label>
            </div>
            <div class="op1">
                <input type="radio" name="quiz" id="option3" />
                <label for="option3" id="label3"></label>
            </div>
            <div class="op1">
                <input type="radio" name="quiz" id="option4" />
                <label for="option4" id="label4"></label>
            </div>
            <button id="next-btn">Next</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
